# CI + security baseline (DevSecOps Phase 1). Public repository: GitHub-hosted runners.
# CI never deploys. identity-api on Railway is deployed by hand: the Railway GitHub app is not installed on this org.
name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  service:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-python.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
    with:
      python-version: ${{ matrix.python-version }}
      # Code is not ruff-formatted yet; lint rules are pinned in pyproject.toml.
      format-check: false
      # [tool.mypy] covers src/ only; tests and scripts are not typed yet.
      typecheck-command: uv pip install "mypy==2.4.0" && mypy
      # Shared admission tests (runtime_tests/) need a real disposable PostgreSQL; the shared workflow exports DATABASE_URL.
      postgres: true
      # Same gates as before: offline contract check, schema pin, every unittest (service tests use a fake database),
      # then the shared PostgreSQL admission tests against the disposable database.
      test-command: >-
        python scripts/check.py
        && python scripts/check_schema_pin.py
        && python -m unittest discover -s tests -v
        && PLATFORM_TEST_DSN="$DATABASE_URL" python -m pytest -q runtime_tests

  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
