[project]
name = "platform-identity"
version = "0.1.0"
description = "Identity platform: token exchange, JWKS and the authorization decision endpoint"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "psycopg[binary]>=3.2,<4",
    "pyjwt[crypto]>=2.10,<3",
    "httpx>=0.27,<1",
    "python-multipart>=0.0.9,<1",
    "sentry-sdk>=2.72,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
identity-api = "platform_identity.app:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
# Explicit rule set so CI does not change when ruff's defaults change: correctness rules plus import order.
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
