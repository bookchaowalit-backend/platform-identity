[project]
name = "platform-identity"
version = "0.1.0"
description = "Identity platform: token exchange, JWKS and the authorization decision endpoint"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "psycopg[binary,pool]>=3.2,<4",
    "pyjwt[crypto]>=2.10,<3",
    "httpx>=0.27,<1",
    "python-multipart>=0.0.9,<1",
    "sentry-sdk>=2.72,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# platform-backend-core needs Python 3.12+; the admission tests that use it run in the 3.12 CI job only.
postgres-test = ["platform-backend-core @ git+https://github.com/bookchaowalit-backend/platform-backend-core.git@85b066fa5e02c960f013ed39a2f0473f2b2ef451 ; python_version >= '3.12'"]

[project.scripts]
identity-api = "platform_identity.app:main"
identity-rate-limit-migrate = "platform_identity.rate_limit:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
platform_identity = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests", "runtime_tests"]
pythonpath = ["src", "tests"]

[tool.ruff.lint]
# Explicit rule set so CI does not change when ruff's defaults change: correctness rules plus import order.
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
