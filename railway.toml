# Railway (Singapore via `railway scale southeast-asia=1`, always on): platform-identity, migration step 3 (shadow).
# Secrets (IDENTITY_DATABASE_URL, IDENTITY_SIGNING_KEY_PEM) are Railway variables only.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
